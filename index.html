<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="static.css" />
    <title>chatbot-militar</title>
    <link rel="icon" type="image/png" href="Exército Brasileiro Logo Vector.svg .png">
  </head>
  <body>
    <div id="chat-container">
      <div id="chat-header">
        <div class="brand">
          <div class="logo-box">
            <img
              src="Exército Brasileiro Logo Vector.svg .png"
              alt="logo-militar"
              width="30px"
              height="30px"
            />
          </div>
          <span>IA militar</span>
        </div>
        <div id="clock">00:00</div>
      </div>

      <div id="chat-window">
        <div class="msg bot">
          Olá sou o sub-tenente Fagundes, no que posso te ajudar?
        </div>
      </div>

      <div id="user-input-container">
        <input
          type="text"
          id="user-input-field"
          placeholder="Pergunte ao Sub-Tenente..."
          autocomplete="off"
        />
        <button id="send-btn">Enviar</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
